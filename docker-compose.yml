version: "3.8"

# =========================================================
# docker-compose.yml - Evolution API (WhatsApp)
# Ejecutar desde la carpeta "docker/": docker-compose up -d
# Documentacion oficial: https://doc.evolution-api.com
# =========================================================

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: jarvis_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Configura EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@evolution-postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=${EVOLUTION_REDIS_URL:-redis://evolution-redis:6379/1}
      - WEBHOOK_GLOBAL_URL=${JARVIS_PUBLIC_URL:?Configura JARVIS_PUBLIC_URL}/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - evolution-redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  evolution-postgres:
    image: postgres:15
    container_name: jarvis_evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?Configura EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    container_name: jarvis_evolution_redis
    restart: always
    volumes:
      - evolution_redis_data:/data

volumes:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
