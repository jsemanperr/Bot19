<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Kaori HUD</title>
<style>
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #0d0f14;
    color: #d7e6ff;
    padding: 16px;
  }
  h1 { font-size: 18px; color: #4fd1ff; margin-bottom: 4px; }
  .estado { font-size: 13px; color: #8fa3c0; margin-bottom: 16px; }
  #chat {
    height: 380px;
    overflow-y: auto;
    background: #12151c;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .msg-usuario { color: #d7e6ff; text-align: right; margin: 6px 0; }
  .msg-jarvis { color: #4fd1ff; text-align: left; margin: 6px 0; }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #2a3040;
    background: #12151c;
    color: #fff;
  }
</style>
</head>
<body>
  <h1>Kaori</h1>
  <div class="estado" id="estado">Conectando...</div>
  <div id="chat"></div>
  <input id="entrada" placeholder="Escribí un comando y presioná Enter..." />

  <script>
    const API_URL = "http://127.0.0.1:8000";
    const chat = document.getElementById("chat");
    const estadoEl = document.getElementById("estado");
    const entrada = document.getElementById("entrada");

    function agregarMensaje(texto, clase) {
      const div = document.createElement("div");
      div.className = clase;
      div.textContent = texto;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function actualizarEstado() {
      try {
        const resp = await fetch(`${API_URL}/status`);
        const data = await resp.json();
        if (data.ok) {
          const animo = data.estado_animo.estado_animo;
          estadoEl.textContent = `Animo: ${animo} | Ultima interaccion: ${data.ultima_interaccion || "sin registros"}`;
        }
      } catch (e) {
        estadoEl.textContent = "JARVIS no disponible (¿esta corriendo el servidor?)";
      }
    }

    entrada.addEventListener("keydown", async (ev) => {
      if (ev.key !== "Enter" || !entrada.value.trim()) return;
      const texto = entrada.value.trim();
      entrada.value = "";
      agregarMensaje(texto, "msg-usuario");

      try {
        const form = new URLSearchParams();
        form.append("texto", texto);
        form.append("remitente", "hud");

        const resp = await fetch(`${API_URL}/command`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: form,
        });
        const data = await resp.json();
        agregarMensaje(data.respuesta || "(sin respuesta)", "msg-jarvis");
      } catch (e) {
        agregarMensaje("No pude conectarme con JARVIS.", "msg-jarvis");
      }
      actualizarEstado();
    });

    actualizarEstado();
    setInterval(actualizarEstado, 15000);
  </script>
</body>
</html>
